name: Keep alive (banco)

# Objetivo ÚNICO: impedir que o projeto do Supabase (free) pause por
# inatividade — ele pausa após ~7 dias sem nenhuma consulta. Qualquer query
# (leitura conta) zera esse relógio.
#
# Frequência de propósito BAIXA (2x/dia). O erro anterior era pingar a cada
# 10 min, o que mantinha a API do Render acordada 24/7 e QUEIMAVA as 750
# horas/mês do free tier — justamente o que suspende o serviço. Duas batidas
# por dia deixam a API dormir quase o tempo todo (gasta pouquíssimas horas) e
# ainda sobra folga enorme sobre a janela de 7 dias do Supabase.
#
# Bate num endpoint público que lê o banco (/api/app-version): acorda a API só
# o suficiente para uma consulta e ela volta a dormir. Não custa nada.

on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Toca o banco via endpoint público (acorda a API, roda 1 query)
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -m 180 -o /dev/null -w "%{http_code}" \
              https://lumilivre-api.onrender.com/api/app-version || echo 000)
            echo "tentativa $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 45
          done
          echo "API não respondeu 200 (cold start longo ou serviço suspenso)."
          # Não falha o job: a próxima janela cobre; a de 7 dias é folgada.
          exit 0
