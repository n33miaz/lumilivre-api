name: Keep alive (API + banco)

# Mantém a instância do Render acordada e, principalmente, o projeto do Supabase
# fora da pausa por inatividade (o plano free pausa após ~7 dias sem nenhuma
# consulta). A API só consulta o banco enquanto está de pé, mas no free ela
# hiberna após ~15 min sem tráfego — então o "escrever no banco de tempos em
# tempos" precisa vir de fora. Este cron bate num endpoint público que lê o
# banco (/api/app-version), o que acorda a API e gera atividade no Postgres.
#
# Observação: o agendador do GitHub Actions é best-effort (pode atrasar sob
# carga). Isso é irrelevante para a janela de 7 dias do Supabase e ajuda — sem
# garantir — a reduzir o cold start. Para eliminar o cold start de vez, só
# saindo do plano free.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (lê o banco e acorda a instância)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -m 120 -o /dev/null -w "%{http_code}" \
              https://lumilivre-api.onrender.com/api/app-version || echo 000)
            echo "tentativa $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "API não respondeu 200 após 3 tentativas (pode ser cold start em curso)."
          # Não falha o job: um ping perdido não é erro, o próximo cron cobre.
          exit 0
