name: CI - LumiLivre API

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        run: ./mvnw test

      - name: Package
        run: ./mvnw package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lumilivre-api-jar
          path: target/*.jar
          if-no-files-found: error
