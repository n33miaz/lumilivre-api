name: CI - LumiLivre API

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-package:
    needs: secrets-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: i18n key coverage check
        run: bash scripts/check-i18n-coverage.sh

      - name: OpenAPI annotation coverage check
        run: bash scripts/check-openapi-annotations.sh

      - name: Verify (test + coverage gate)
        run: ./mvnw verify -Djacoco.enforce=true --no-transfer-progress

      - name: Package
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lumilivre-api-coverage
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: lumilivre-api-jar
          path: target/*.jar
          if-no-files-found: error
