spring.application.name=lumilivre-test

# ============================================================
# Testes unitarios e com @SpringBootTest usam H2 em modo Postgres.
# Durante a migracao V2, os testes existentes rodam contra o baseline
# legado (PT-BR) em src/main/resources/db/legacy/ enquanto as entidades
# JPA ainda estao em PT-BR. Depois do PR 5 (refatoracao do backend)
# essa configuracao migra para Testcontainers Postgres como padrao.
#
# Testes de migration/schema do PR 4 usam Testcontainers direto e nao
# dependem dessa application.properties.
# ============================================================
spring.datasource.url=jdbc:h2:mem:lumilivre_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.scheduling.enabled=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/legacy

jwt.secret=test-secret-key-with-enough-length-for-hmac-signature
jwt.expiration=86400000

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

supabase.url=https://example.supabase.co
supabase.key=test-key
supabase.service-role.key=test-service-role-key
supabase.bucket.capas=capas
supabase.bucket.tccs=tcc
supabase.bucket.avatars=avatars
supabase.storage.base-url-capas=https://example.supabase.co/storage/v1/object/capas/livros
supabase.storage.base-url-tccs=https://example.supabase.co/storage/v1/object/tcc

app.cors.allowed-origins=http://localhost:5173
