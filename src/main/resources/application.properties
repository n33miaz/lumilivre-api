spring.application.name=lumilivre

# Banco de dados (Supabase Postgres)
spring.datasource.url=${LUMILIVRE_DB_URL}
spring.datasource.username=${LUMILIVRE_DB_USER}
spring.datasource.password=${LUMILIVRE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=${LUMILIVRE_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Pool de conexoes
# Supabase/poolers can close idle connections before Hikari's 30 min default.
spring.datasource.hikari.validation-timeout=${LUMILIVRE_DB_VALIDATION_TIMEOUT:3000}
spring.datasource.hikari.keepalive-time=${LUMILIVRE_DB_KEEPALIVE_TIME:240000}
spring.datasource.hikari.maximum-pool-size=${LUMILIVRE_DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${LUMILIVRE_DB_MIN_IDLE:2}
spring.datasource.hikari.max-lifetime=${LUMILIVRE_DB_MAX_LIFETIME:540000}
spring.datasource.hikari.idle-timeout=${LUMILIVRE_DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${LUMILIVRE_DB_CONNECTION_TIMEOUT:30000}

# JWT
jwt.secret=${LUMILIVRE_JWT_SECRET}
jwt.expiration=${LUMILIVRE_JWT_EXPIRATION:86400000}

# Email
spring.mail.host=${LUMILIVRE_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${LUMILIVRE_MAIL_PORT:587}
spring.mail.username=${LUMILIVRE_MAIL_USERNAME}
spring.mail.password=${LUMILIVRE_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application identity used in outbound emails and links
app.email.from=${LUMILIVRE_EMAIL_FROM:contato.lumilivre@gmail.com}
app.public-url=${LUMILIVRE_PUBLIC_URL:https://www.lumilivre.com.br}

# Email visual identity (single, customizable source for every transactional email).
# Palette mirrors the web client (tailwind.config.js): #5E195D / #762075 / #9D4D9C.
# Leave logo-url blank to embed the bundled logo inline (cid:) — no external hosting needed.
app.email.branding.brand-name=${LUMILIVRE_EMAIL_BRAND_NAME:LumiLivre}
app.email.branding.logo-url=${LUMILIVRE_EMAIL_LOGO_URL:}
app.email.branding.primary-color=${LUMILIVRE_EMAIL_PRIMARY:#762075}
app.email.branding.primary-dark=${LUMILIVRE_EMAIL_PRIMARY_DARK:#5E195D}
app.email.branding.accent-color=${LUMILIVRE_EMAIL_ACCENT:#9D4D9C}
app.email.branding.company-name=${LUMILIVRE_EMAIL_COMPANY:LumiLivre}
app.email.branding.support-email=${LUMILIVRE_EMAIL_SUPPORT:${app.email.from}}
app.email.branding.address-line=${LUMILIVRE_EMAIL_ADDRESS:}

server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Storage provider (Strategy)
# supabase = Supabase Storage REST (default, prod)
# local    = filesystem local (dev/test)
lumilivre.storage.provider=${LUMILIVRE_STORAGE_PROVIDER:supabase}
lumilivre.storage.local.base-dir=${LUMILIVRE_STORAGE_LOCAL_BASE_DIR:./storage}
lumilivre.storage.local.public-url=${LUMILIVRE_STORAGE_LOCAL_PUBLIC_URL:http://localhost:8080/storage}

# Supabase
supabase.url=${LUMILIVRE_SUPABASE_URL}
supabase.key=${LUMILIVRE_SUPABASE_KEY}
supabase.service-role.key=${LUMILIVRE_SUPABASE_SERVICE_ROLE_KEY}

# Buckets separados
supabase.bucket.capas=covers
supabase.bucket.tccs=theses
supabase.bucket.avatars=avatars

# Upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.location=${java.io.tmpdir}
supabase.storage.base-url-capas=${LUMILIVRE_SUPABASE_URL}/storage/v1/object/covers/livros
supabase.storage.base-url-tccs=${LUMILIVRE_SUPABASE_URL}/storage/v1/object/theses

# CORS (origens separadas por virgula)
app.cors.allowed-origins=${LUMILIVRE_CORS_ORIGINS:http://localhost:5173,http://localhost:8080}

# Feature flags
# Set LUMILIVRE_API_ENABLED=false to block all /api/** routes (rollback switch)
app.api.enabled=${LUMILIVRE_API_ENABLED:true}
app.scheduling.enabled=${LUMILIVRE_SCHEDULING_ENABLED:true}

# Resilience4j — external service resilience
resilience4j.circuitbreaker.instances.googleBooks.slidingWindowSize=10
resilience4j.circuitbreaker.instances.googleBooks.failureRateThreshold=50
resilience4j.circuitbreaker.instances.googleBooks.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.googleBooks.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.googleBooks.maxAttempts=3
resilience4j.retry.instances.googleBooks.waitDuration=500ms
resilience4j.retry.instances.googleBooks.retryExceptions=java.io.IOException,org.springframework.web.client.ResourceAccessException

resilience4j.timelimiter.instances.googleBooks.timeoutDuration=3s

resilience4j.circuitbreaker.instances.brasilApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.brasilApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.brasilApi.waitDurationInOpenState=30s

resilience4j.retry.instances.brasilApi.maxAttempts=2
resilience4j.retry.instances.brasilApi.waitDuration=300ms

resilience4j.circuitbreaker.instances.supabaseStorage.slidingWindowSize=5
resilience4j.circuitbreaker.instances.supabaseStorage.failureRateThreshold=60
resilience4j.circuitbreaker.instances.supabaseStorage.waitDurationInOpenState=60s

resilience4j.circuitbreaker.instances.openLibrary.slidingWindowSize=10
resilience4j.circuitbreaker.instances.openLibrary.failureRateThreshold=50
resilience4j.circuitbreaker.instances.openLibrary.waitDurationInOpenState=30s
resilience4j.retry.instances.openLibrary.maxAttempts=2
resilience4j.retry.instances.openLibrary.waitDuration=300ms

resilience4j.circuitbreaker.instances.postalCode.slidingWindowSize=10
resilience4j.circuitbreaker.instances.postalCode.failureRateThreshold=50
resilience4j.circuitbreaker.instances.postalCode.waitDurationInOpenState=30s
resilience4j.retry.instances.postalCode.maxAttempts=2
resilience4j.retry.instances.postalCode.waitDuration=300ms
resilience4j.timelimiter.instances.postalCode.timeoutDuration=2s

# Book metadata chain (Strategy + Chain)
# Ordem dos providers; cada um pode ser desligado independentemente via
# lumilivre.book-metadata.<name>.enabled=false
lumilivre.book-metadata.providers=${LUMILIVRE_BOOK_METADATA_PROVIDERS:googleBooks,brasilApi,openLibrary}

# SpringDoc / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls-primary-name=api-pt-br
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-operation-id=false
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=1
springdoc.swagger-ui.syntax-highlight.theme=obsidian
springdoc.swagger-ui.custom-css=/swagger-ui/custom.css
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.show-actuator=false

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=lumilivre

# Flyway (Banco de Dados)
spring.flyway.enabled=${LUMILIVRE_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# modos de migracao
#   apenas tabelas: classpath:db/migration,classpath:db/vendor/{vendor}
#   tabelas + seed: classpath:db/migration,classpath:db/seed,classpath:db/vendor/{vendor}
#   apenas seed   : classpath:db/seed
spring.flyway.locations=${LUMILIVRE_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed,classpath:db/vendor/{vendor}}

# Cache Configuration
spring.cache.cache-names=dashboard_stats,dashboard_active_overdue_count,dashboard_overdue_count,dashboard_overdue_list,dashboard_loan_requests,dashboard_top_books,dashboard_loans_by_month,book_count,reader_count,cdds,generos-dto,modulos,turnos,mobile_catalog,mobile_recommendations,book_detail,postal_codes
# Set LUMILIVRE_CACHE_TYPE=redis in prod to activate the Redis CacheManager
spring.cache.type=${LUMILIVRE_CACHE_TYPE:simple}
spring.data.redis.url=${LUMILIVRE_REDIS_URL:}
