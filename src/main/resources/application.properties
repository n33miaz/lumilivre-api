spring.application.name=lumilivre
server.port=${PORT:8080}

# BANCO DE DADOS
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações de Conexão e SSL
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.connection-test-query=SELECT 1

# Pool de Conexões 
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# SEGURANÇA (JWT)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# E-MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# COMPRESSÃO
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# SUPABASE & ARMAZENAMENTO
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}

# Nomes dos Buckets
supabase.bucket.capas=capas
supabase.bucket.tccs=tcc

# URLs Base para Storage
supabase.storage.base-url-capas=${supabase.url}/storage/v1/object/capas/livros
supabase.storage.base-url-tccs=${supabase.url}/storage/v1/object/tcc

# Upload de Arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.location=${java.io.tmpdir}

# CACHE
spring.cache.cache-names=generos,cdds,modulos,turnos,livro-detalhe,catalogo-mobile