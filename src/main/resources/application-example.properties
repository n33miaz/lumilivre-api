spring.application.name=lumilivre

# ============================================================
#  Banco de dados (Supabase Postgres via Session pooler 5432)
#  Exporte variaveis antes de iniciar a aplicacao:
#    LUMILIVRE_DB_URL=jdbc:postgresql://<host>:5432/postgres?sslmode=require
#    LUMILIVRE_DB_USER=postgres.<project-ref>
#    LUMILIVRE_DB_PASSWORD=<senha>
# ============================================================
spring.datasource.url=${LUMILIVRE_DB_URL}
spring.datasource.username=${LUMILIVRE_DB_USER}
spring.datasource.password=${LUMILIVRE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000

# ============================================================
#  JWT
#    LUMILIVRE_JWT_SECRET: string aleatoria >= 64 chars
#    LUMILIVRE_JWT_EXPIRATION: milissegundos (padrao 86400000 = 24h)
# ============================================================
jwt.secret=${LUMILIVRE_JWT_SECRET}
jwt.expiration=${LUMILIVRE_JWT_EXPIRATION:86400000}

# ============================================================
#  Email (SMTP)
#    Para Gmail: gere uma App Password em myaccount.google.com
# ============================================================
spring.mail.host=${LUMILIVRE_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${LUMILIVRE_MAIL_PORT:587}
spring.mail.username=${LUMILIVRE_MAIL_USERNAME}
spring.mail.password=${LUMILIVRE_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ============================================================
#  Supabase
#    supabase.key                e a chave publishable/anon (uso publico restrito).
#    supabase.service-role.key   e o JWT service_role; bypassa RLS. Usado pelo
#                                backend para Storage e operacoes administrativas.
# ============================================================
supabase.url=${LUMILIVRE_SUPABASE_URL}
supabase.key=${LUMILIVRE_SUPABASE_KEY}
supabase.service-role.key=${LUMILIVRE_SUPABASE_SERVICE_ROLE_KEY}

# Buckets (nomes em ingles conforme MIGRATION_PLAN secao 4.6)
supabase.bucket.capas=covers
supabase.bucket.tccs=theses
supabase.bucket.avatars=avatars

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.location=${java.io.tmpdir}
supabase.storage.base-url-capas=${LUMILIVRE_SUPABASE_URL}/storage/v1/object/covers/livros
supabase.storage.base-url-tccs=${LUMILIVRE_SUPABASE_URL}/storage/v1/object/theses

# ============================================================
#  CORS - origens permitidas, separadas por virgula, por ambiente.
#  A aplicacao recusa o boot quando a lista esta vazia ou contem
#  valores invalidos (ver SecurityConfig.validateCorsOrigins).
#
#  Convencoes por ambiente:
#    dev     -> http://localhost:5173,http://localhost:8080
#    staging -> https://staging.lumilivre.com.br
#    prod    -> https://www.lumilivre.com.br,https://app.lumilivre.com.br
#
#  Regras:
#    * Nenhuma entrada com "*" (backend envia JWT em header Authorization
#      + credentials=true; wildcard quebra a spec CORS).
#    * Todos os valores devem ser origins http(s) sem espaco em branco.
#    * Nao deixe trailing slash ("/") - Spring compara origens por string exata.
#    * Nao inclua path, query string, fragmento ou userinfo.
# ============================================================
app.cors.allowed-origins=${LUMILIVRE_CORS_ORIGINS:http://localhost:5173,http://localhost:8080}

spring.cache.cache-names=generos,cdds,modulos,turnos,livro-detalhe,catalogo-mobile

# ============================================================
#  Flyway
#  Desabilitado durante a migracao V2. Habilitar apenas quando o
#  baseline novo em ingles estiver publicado (PR 3).
# ============================================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
