spring.application.name=lumilivre

# ============================================================
#  Banco de dados (Supabase Postgres via Session pooler 5432)
#  Exporte variaveis antes de iniciar a aplicacao:
#    LUMILIVRE_DB_URL=jdbc:postgresql://<host>:5432/postgres?sslmode=require
#    LUMILIVRE_DB_USER=postgres.<project-ref>
#    LUMILIVRE_DB_PASSWORD=<senha>
# ============================================================
spring.datasource.url=${LUMILIVRE_DB_URL}
spring.datasource.username=${LUMILIVRE_DB_USER}
spring.datasource.password=${LUMILIVRE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=${LUMILIVRE_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Supabase/poolers can close idle connections before Hikari's 30 min default.
spring.datasource.hikari.validation-timeout=${LUMILIVRE_DB_VALIDATION_TIMEOUT:3000}
spring.datasource.hikari.keepalive-time=${LUMILIVRE_DB_KEEPALIVE_TIME:240000}
spring.datasource.hikari.maximum-pool-size=${LUMILIVRE_DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${LUMILIVRE_DB_MIN_IDLE:2}
spring.datasource.hikari.max-lifetime=${LUMILIVRE_DB_MAX_LIFETIME:540000}
spring.datasource.hikari.idle-timeout=${LUMILIVRE_DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${LUMILIVRE_DB_CONNECTION_TIMEOUT:30000}

# ============================================================
#  JWT
#    LUMILIVRE_JWT_SECRET: string aleatoria >= 64 chars
#    LUMILIVRE_JWT_EXPIRATION: milissegundos (padrao 86400000 = 24h)
# ============================================================
jwt.secret=${LUMILIVRE_JWT_SECRET}
jwt.expiration=${LUMILIVRE_JWT_EXPIRATION:86400000}

# ============================================================
#  Email (SMTP)
#    Para Gmail: gere uma App Password em myaccount.google.com
# ============================================================
spring.mail.host=${LUMILIVRE_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${LUMILIVRE_MAIL_PORT:587}
spring.mail.username=${LUMILIVRE_MAIL_USERNAME}
spring.mail.password=${LUMILIVRE_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ============================================================
#  Storage provider (Strategy — ADR-011)
#    LUMILIVRE_STORAGE_PROVIDER=supabase  (default, prod)
#    LUMILIVRE_STORAGE_PROVIDER=local     (filesystem em ./storage — dev/test)
# ============================================================
lumilivre.storage.provider=${LUMILIVRE_STORAGE_PROVIDER:supabase}
lumilivre.storage.local.base-dir=${LUMILIVRE_STORAGE_LOCAL_BASE_DIR:./storage}
lumilivre.storage.local.public-url=${LUMILIVRE_STORAGE_LOCAL_PUBLIC_URL:http://localhost:8080/storage}

# ============================================================
#  Supabase
#    supabase.key                e a chave publishable/anon (uso publico restrito).
#    supabase.service-role.key   e o JWT service_role; bypassa RLS. Usado pelo
#                                backend para Storage e operacoes administrativas.
# ============================================================
supabase.url=${LUMILIVRE_SUPABASE_URL}
supabase.key=${LUMILIVRE_SUPABASE_KEY}
supabase.service-role.key=${LUMILIVRE_SUPABASE_SERVICE_ROLE_KEY}

# Buckets (nomes em ingles conforme MIGRATION_PLAN secao 4.6)
supabase.bucket.capas=covers
supabase.bucket.tccs=theses
supabase.bucket.avatars=avatars

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.location=${java.io.tmpdir}
supabase.storage.base-url-capas=${LUMILIVRE_SUPABASE_URL}/storage/v1/object/covers/livros
supabase.storage.base-url-tccs=${LUMILIVRE_SUPABASE_URL}/storage/v1/object/theses

# ============================================================
#  CORS - origens permitidas, separadas por virgula, por ambiente.
#  A aplicacao recusa o boot quando a lista esta vazia ou contem
#  valores invalidos (ver SecurityConfig.validateCorsOrigins).
#
#  Convencoes por ambiente:
#    dev     -> http://localhost:5173,http://localhost:8080
#    staging -> https://staging.lumilivre.com.br
#    prod    -> https://www.lumilivre.com.br,https://app.lumilivre.com.br
#
#  Regras:
#    * Nenhuma entrada com "*" (backend envia JWT em header Authorization
#      + credentials=true; wildcard quebra a spec CORS).
#    * Todos os valores devem ser origins http(s) sem espaco em branco.
#    * Nao deixe trailing slash ("/") - Spring compara origens por string exata.
#    * Nao inclua path, query string, fragmento ou userinfo.
# ============================================================
app.cors.allowed-origins=${LUMILIVRE_CORS_ORIGINS:http://localhost:5173,http://localhost:8080}

# Feature flags
app.api.enabled=${LUMILIVRE_API_ENABLED:true}
app.scheduling.enabled=${LUMILIVRE_SCHEDULING_ENABLED:true}

spring.cache.cache-names=dashboard_stats,dashboard_active_overdue_count,dashboard_overdue_count,dashboard_overdue_list,dashboard_loan_requests,dashboard_top_books,dashboard_loans_by_month,book_count,student_count,cdds,generos-dto,modulos,turnos,mobile_catalog,mobile_recommendations,book_detail,postal_codes

# ============================================================
#  Flyway
#  Por seguranca, migrations continuam opt-in na subida da app.
#  Para criar um banco dev vazio, defina:
#    LUMILIVRE_FLYWAY_ENABLED=true
#  Modos de migração
#    apenas tabelas: classpath:db/migration,classpath:db/vendor/{vendor}
#    tabelas + seed: classpath:db/migration,classpath:db/seed,classpath:db/vendor/{vendor}
#    apenas seed   : classpath:db/seed
# ============================================================
spring.flyway.enabled=${LUMILIVRE_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=${LUMILIVRE_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/vendor/{vendor}}
