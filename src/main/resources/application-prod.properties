# =============================================================================
#  Overrides do perfil `prod` — custo de inicializacao
# -----------------------------------------------------------------------------
#  O Spring Boot so abre a porta HTTP no FIM da inicializacao. Numa instancia
#  pequena (Render free: 0.1 vCPU / 512 MB) o contexto levava ~309 s para
#  subir, e o scan de porta do host desistia antes — a aplicacao ficava pronta
#  10 s depois do timeout e o deploy era marcado como falho.
#
#  Nada aqui muda comportamento da API: sao trabalhos de startup que a producao
#  nao usa. Em dev tudo continua ligado, porque o perfil default nao le este
#  arquivo.
# =============================================================================

# O Spring Data Redis inspeciona TODOS os repositorios JPA na subida para
# decidir se algum e repositorio Redis — e nenhum e (o log registra os 20, um a
# um, e conclui "Found 0 Redis repository interfaces"). O cache Redis continua
# funcionando: isto desliga so a varredura de REPOSITORIOS.
spring.data.redis.repositories.enabled=false

# Sem console JMX na nuvem; registrar os MBeans custa tempo e nao serve a nada.
spring.jmx.enabled=false

# O springdoc percorre os 112 endpoints e resolve os textos i18n para montar o
# spec. Em producao o Swagger ja era restrito (SEC-18); desligar de vez economiza
# a construcao inteira e remove a superficie. Os clients (orval / dart-dio) sao
# gerados a partir do ambiente de desenvolvimento, que mantem o spec ligado.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
