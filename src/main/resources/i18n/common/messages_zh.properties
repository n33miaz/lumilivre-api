# Error titles
error.validation.title=校验错误
error.validation.message=一个或多个字段无效，请查看下面的明细。
error.resource-not-found.title=未找到资源
error.business-rule.title=违反业务规则
error.policy-violation.title=违反业务策略
error.invalid-request.title=请求无效
error.method-not-allowed.title=方法不允许
error.method-not-allowed.message=此资源不支持所使用的 HTTP 方法。
error.unauthorized.title=未认证
error.unauthorized.message=认证令牌无效、已过期或缺失。
error.access-denied.title=拒绝访问
error.access-denied.message=你没有访问此资源的权限。
# 403 from the initial-password gate. Carries code=PASSWORD_CHANGE_REQUIRED, which
# the app uses to open the change-password screen instead of logging the user out.
error.password-change-required.title=必须修改密码
error.password-change-required.message=请先修改初始密码再继续。
error.too-many-attempts.title=尝试次数过多
error.too-many-attempts.message=登录尝试次数过多，账号已临时锁定。请稍后再试。
# Per-origin (IP) limit, distinct from the per-account lockout above.
error.rate-limit.title=请求过于频繁
error.rate-limit.message=已超出尝试次数限制，请在 {0} 分钟后重试。
error.internal.title=服务器内部错误
error.internal.message=发生了意外错误，请联系技术支持。
# Generic invalid-input message: the exception detail stays in the log with the
# correlationId, never in the response (table, column and SQL fragments leak through it).
error.invalid-request.message=请求无效，请检查提交的数据。
error.sort.invalid-field=排序字段无效：“{0}”。可用字段：{1}。
error.parameter.invalid-value=此参数的值无效。
metadata.enum-type.unsupported=不支持的元数据类型：{0}
metadata.postal-code.invalid=邮政编码无效，请输入正好 8 位数字。
metadata.postal-code.not-found=未找到邮政编码：{0}
metadata.academic-module.not-found=未找到模块。
metadata.academic-module.name.already-exists=已存在同名模块。
metadata.study-shift.not-found=未找到时段。
metadata.study-shift.name.already-exists=已存在同名时段。
error.route-not-found.message=请求的路径在本 API 中不存在。
