# Error titles
error.validation.title=Error de validación
error.validation.message=Uno o más campos son inválidos. Revisa los detalles a continuación.
error.resource-not-found.title=Recurso no encontrado
error.business-rule.title=Violación de regla de negocio
error.policy-violation.title=Violación de política de negocio
error.invalid-request.title=Petición inválida
error.method-not-allowed.title=Método no permitido
error.method-not-allowed.message=El método HTTP utilizado no es compatible con este recurso.
error.unauthorized.title=No autenticado
error.unauthorized.message=Token de autenticación inválido, expirado o ausente.
error.access-denied.title=Acceso denegado
error.access-denied.message=No tienes permiso para acceder a este recurso.
# 403 from the initial-password gate. Carries code=PASSWORD_CHANGE_REQUIRED, which
# the app uses to open the change-password screen instead of logging the user out.
error.password-change-required.title=Cambio de contraseña obligatorio
error.password-change-required.message=Cambia la contraseña inicial antes de continuar.
error.too-many-attempts.title=Demasiados intentos
error.too-many-attempts.message=Cuenta bloqueada temporalmente por demasiados intentos de inicio de sesión. Inténtalo de nuevo más tarde.
# Per-origin (IP) limit, distinct from the per-account lockout above.
error.rate-limit.title=Demasiadas peticiones
error.rate-limit.message=Límite de intentos excedido. Inténtalo de nuevo en {0} minuto(s).
error.internal.title=Error interno del servidor
error.internal.message=Ocurrió un error inesperado. Ponte en contacto con el soporte.
# Generic invalid-input message: the exception detail stays in the log with the
# correlationId, never in the response (table, column and SQL fragments leak through it).
error.invalid-request.message=Petición inválida. Revisa los datos enviados.
error.sort.invalid-field=Campo de ordenación inválido: ''{0}''. Campos aceptados: {1}.
error.parameter.invalid-value=Valor inválido para este parámetro.
metadata.enum-type.unsupported=Tipo de metadato no compatible: {0}
metadata.postal-code.invalid=Código postal inválido. Introduce exactamente 8 dígitos.
metadata.postal-code.not-found=Código postal no encontrado: {0}
metadata.academic-module.not-found=Módulo no encontrado.
metadata.academic-module.name.already-exists=Ya existe un módulo con este nombre.
metadata.study-shift.not-found=Turno no encontrado.
metadata.study-shift.name.already-exists=Ya existe un turno con este nombre.
error.route-not-found.message=La ruta solicitada no existe en esta API.
