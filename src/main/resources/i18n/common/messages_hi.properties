# Per-origin (IP) limit, distinct from the per-account lockout above.
error.rate-limit.title=बहुत अधिक अनुरोध
error.rate-limit.message=प्रयासों की सीमा पार हो गई। {0} मिनट बाद पुनः प्रयास करें।
