# Hibernate Validator message overrides
jakarta.validation.constraints.NotBlank.message=必填字段
jakarta.validation.constraints.NotNull.message=必填字段
jakarta.validation.constraints.NotEmpty.message=必填字段
jakarta.validation.constraints.Email.message=电子邮箱地址无效
jakarta.validation.constraints.Size.message=长度必须在 {min} 到 {max} 个字符之间
jakarta.validation.constraints.Min.message=允许的最小值：{value}
jakarta.validation.constraints.Max.message=允许的最大值：{value}
jakarta.validation.constraints.Pattern.message=格式无效
jakarta.validation.constraints.Positive.message=必须是正数
jakarta.validation.constraints.PositiveOrZero.message=必须是零或正数
jakarta.validation.constraints.Past.message=必须是过去的日期
jakarta.validation.constraints.Future.message=必须是将来的日期

# Password strength (SEC-10). Messages say what to fix without spelling out the
# whole policy: guessing the rules should not come with a free checklist.
validation.password.too-short=密码太短，请至少使用 8 个字符。
validation.password.too-long=密码太长，最多 72 个字符。
validation.password.too-common=这个密码太常见，容易被猜到，请换一个。
validation.password.too-simple=这个密码太容易预测，请混合使用不同字符。
validation.password.personal-data=密码不能以你的注册资料为基础。
validation.password.same-as-current=新密码必须与当前密码不同。
