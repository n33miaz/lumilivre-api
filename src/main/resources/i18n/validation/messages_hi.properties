jakarta.validation.constraints.Future.message=आगे की तारीख़ होनी चाहिए

# Password strength (SEC-10). Messages say what to fix without spelling out the
# whole policy: guessing the rules should not come with a free checklist.
validation.password.too-short=पासवर्ड बहुत छोटा है। कम से कम 8 अक्षर रखें।
validation.password.too-long=पासवर्ड बहुत लंबा है। अधिकतम 72 अक्षर रखें।
validation.password.too-common=यह पासवर्ड आम है और आसानी से अनुमान लगाया जा सकता है। दूसरा चुनें।
validation.password.too-simple=यह पासवर्ड अनुमान लगाने योग्य है। अलग-अलग अक्षर मिलाएँ।
validation.password.personal-data=पासवर्ड आपके पंजीकरण विवरण पर आधारित नहीं हो सकता।
validation.password.same-as-current=नया पासवर्ड मौजूदा पासवर्ड से अलग होना चाहिए।
