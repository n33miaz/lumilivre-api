jakarta.validation.constraints.NotNull.message=यह फ़ील्ड आवश्यक है
jakarta.validation.constraints.NotEmpty.message=यह फ़ील्ड आवश्यक है
jakarta.validation.constraints.Email.message=ईमेल पता अमान्य
jakarta.validation.constraints.Size.message={min} से {max} अक्षरों के बीच होना चाहिए
jakarta.validation.constraints.Min.message=न्यूनतम अनुमत मान: {value}
jakarta.validation.constraints.Max.message=अधिकतम अनुमत मान: {value}
jakarta.validation.constraints.Pattern.message=प्रारूप अमान्य
