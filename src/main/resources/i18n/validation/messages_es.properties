# Password strength (SEC-10). Messages say what to fix without spelling out the
# whole policy: guessing the rules should not come with a free checklist.
validation.password.too-short=Contraseña demasiado corta. Usa al menos 8 caracteres.
validation.password.too-long=Contraseña demasiado larga. Usa como máximo 72 caracteres.
validation.password.too-common=Esa contraseña es conocida y fácil de adivinar. Elige otra.
validation.password.too-simple=Esa contraseña es previsible. Varía los caracteres.
validation.password.personal-data=La contraseña no puede basarse en tus datos de registro.
validation.password.same-as-current=La nueva contraseña debe ser distinta de la actual.
