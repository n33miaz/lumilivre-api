# Forca de senha (SEC-10). As mensagens dizem o que corrigir sem listar a regra
# inteira: quem tenta adivinhar a politica nao ganha um checklist de graca.
validation.password.too-short=Senha muito curta. Use ao menos 8 caracteres.
validation.password.too-long=Senha longa demais. Use no máximo 72 caracteres.
validation.password.too-common=Essa senha é conhecida e fácil de adivinhar. Escolha outra.
validation.password.too-simple=Essa senha é previsível. Varie os caracteres.
validation.password.personal-data=A senha não pode ser baseada nos seus dados de cadastro.
validation.password.same-as-current=A nova senha precisa ser diferente da atual.
