# Hibernate Validator message overrides
jakarta.validation.constraints.NotBlank.message=Required field
jakarta.validation.constraints.NotNull.message=Required field
jakarta.validation.constraints.NotEmpty.message=Required field
jakarta.validation.constraints.Email.message=Invalid e-mail address
jakarta.validation.constraints.Size.message=Must be between {min} and {max} characters
jakarta.validation.constraints.Min.message=Minimum allowed value: {value}
jakarta.validation.constraints.Max.message=Maximum allowed value: {value}
jakarta.validation.constraints.Pattern.message=Invalid format
jakarta.validation.constraints.Positive.message=Must be a positive number
jakarta.validation.constraints.PositiveOrZero.message=Must be zero or positive
jakarta.validation.constraints.Past.message=Must be a date in the past
jakarta.validation.constraints.Future.message=Must be a date in the future

# Password strength (SEC-10). Messages say what to fix without spelling out the
# whole policy: guessing the rules should not come with a free checklist.
validation.password.too-short=Password is too short. Use at least 8 characters.
validation.password.too-long=Password is too long. Use at most 72 characters.
validation.password.too-common=That password is well known and easy to guess. Pick another one.
validation.password.too-simple=That password is predictable. Vary the characters.
validation.password.personal-data=The password cannot be based on your registration data.
validation.password.same-as-current=The new password must be different from the current one.
