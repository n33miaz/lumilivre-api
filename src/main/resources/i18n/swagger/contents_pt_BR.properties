swagger.tag.contents.name=09. Conteúdos
swagger.tag.contents.description=Publicação de conteúdos do app do leitor: comunicados, anexos e trabalhos/TCCs, com controles de visibilidade (publicação, destaque, público e janela).
swagger.operation.contents.list.summary=Lista conteúdos
swagger.operation.contents.list.description=Retorna todos os conteúdos (inclusive despublicados/agendados) para o painel admin, com filtro textual e por tipo.
swagger.operation.contents.get.summary=Consulta conteúdo
swagger.operation.contents.get.description=Retorna metadados e links de um conteúdo específico.
swagger.operation.contents.search.summary=Busca conteúdos
swagger.operation.contents.search.description=Filtra conteúdos por tipo, público, curso e ano.
swagger.operation.contents.create.summary=Cadastra conteúdo
swagger.operation.contents.create.description=Cria conteúdo por multipart, recebendo JSON no campo `data` e arquivos opcionais de capa (`coverFile`) e documento (`docFile`).
swagger.operation.contents.update.summary=Atualiza conteúdo
swagger.operation.contents.update.description=Atualiza metadados e, opcionalmente, substitui capa ou documento de um conteúdo existente.
swagger.operation.contents.delete.summary=Remove conteúdo
swagger.operation.contents.delete.description=Remove (soft delete) um conteúdo do repositório.
swagger.operation.contents.feed.summary=Mural do leitor
swagger.operation.contents.feed.description=Retorna os conteúdos visíveis ao leitor autenticado: publicados, dentro da janela e direcionados ao seu público (curso/módulo/turno) ou a todos.
swagger.requestBody.contents.create.description=Multipart com `data` JSON e arquivos opcionais `coverFile` e `docFile`.
swagger.requestBody.contents.update.description=Multipart com dados atualizados e arquivos opcionais.
