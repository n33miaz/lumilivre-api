swagger.tag.students.name=3. Students
swagger.tag.students.description=Student registration, lookup, updates, photo, initial password, ranking and own-profile access.
swagger.operation.students.list.summary=List students
swagger.operation.students.list.description=Returns students in an administrative page with optional text search. Restricted to ADMIN and LIBRARIAN.
swagger.operation.students.search.summary=Advanced student search
swagger.operation.students.search.description=Filters students by registration, name, course, shift, module and penalty for desk operations and reports.
swagger.operation.students.get.summary=Get student
swagger.operation.students.get.description=Returns detailed student data. ADMIN/LIBRARIAN can access any student; STUDENT can access only their own registration number.
swagger.operation.students.create.summary=Register student
swagger.operation.students.create.description=Creates a student record, validates course, shift and module, and creates a STUDENT user when e-mail is present.
swagger.operation.students.update.summary=Update student
swagger.operation.students.update.description=Updates registration data, address and academic links for an existing student.
swagger.operation.students.delete.summary=Delete student
swagger.operation.students.delete.description=Removes or disables the student according to domain integrity rules.
swagger.operation.students.resetPassword.summary=Reset student password
swagger.operation.students.resetPassword.description=Resets the student password to their registration number. Used by administrators during support.
swagger.operation.students.uploadAvatar.summary=Upload student photo
swagger.operation.students.uploadAvatar.description=Receives a multipart image and updates the student's profile photo. Students can update only their own photo.
swagger.operation.students.ranking.summary=Student ranking
swagger.operation.students.ranking.description=Returns student ranking by loan count, with optional filters by course, module and shift.
swagger.requestBody.students.create.description=Complete student data.
swagger.requestBody.students.update.description=Updated student data.
swagger.requestBody.students.uploadAvatar.description=Profile photo image file.
