swagger.operation.interest.toggle.summary=Marca interesse no livro
swagger.operation.interest.toggle.description=Registra que o leitor autenticado quer ler este livro. Idempotente: marcar de novo responde 200 com o mesmo estado e a data da primeira marcação, nunca 409. O leitor vem do token — não existe parâmetro de matrícula. Exclusivo de LEITOR; convidado recebe 401 e a equipe 403.
swagger.operation.interest.remove.summary=Remove interesse no livro
swagger.operation.interest.remove.description=Apaga o interesse do leitor autenticado neste livro. Idempotente: desmarcar o que não estava marcado responde 200 com interested=false. Devolve corpo em vez de 204 para o cliente usar o mesmo parse do marcar. Exclusivo de LEITOR.
swagger.operation.interest.mine.summary=Interesses do próprio leitor
swagger.operation.interest.mine.description=Página com os livros que o leitor autenticado marcou, dos mais recentes para os mais antigos. Substitui a lista de favoritos que ficava no armazenamento local do celular. Ordenação fixa (data de marcação e desempate por id); o parâmetro sort é ignorado.
swagger.operation.interest.summary.summary=Indicador de interesse do acervo
swagger.operation.interest.summary.description=Visão agregada para a biblioteca: por livro, quantos leitores o querem cruzado com quantos exemplares existem e quantos estão disponíveis. Ordenado do mais desejado para o menos, e entre iguais pelo que a biblioteca menos consegue atender. Nunca identifica leitores — interesse é dado de comportamento de menor de idade e a decisão de compra de acervo se toma pela contagem. Restrito a ADMIN e LIBRARIAN.
swagger.parameter.interest.summary.unmetOnly.description=Quando verdadeiro, devolve apenas livros sem nenhum exemplar disponível — a fila de compra de acervo.
