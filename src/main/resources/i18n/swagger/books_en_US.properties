swagger.tag.books.name=04. Books
swagger.tag.books.description=Catalogue, administrative and public search, grouping, external metadata, recommendations and cover upload.
swagger.operation.books.list.summary=List administrative catalogue
swagger.operation.books.list.description=Returns a book page for the admin table, with copy counts and summary data. Restricted to ADMIN and LIBRARIAN.
swagger.operation.books.search.summary=Search books by text
swagger.operation.books.search.description=Text search across the administrative catalogue by title, author, ISBN and related fields.
swagger.operation.books.grouped.summary=List grouped books
swagger.operation.books.grouped.description=Groups books by title and edition to reduce visual duplication in the admin panel.
swagger.operation.books.advanced.summary=Advanced book search
swagger.operation.books.advanced.description=Filters books by title, ISBN, author, genre, publisher, Dewey code, age rating, cover type and publication date.
swagger.operation.books.publicSearch.summary=Public catalogue search
swagger.operation.books.publicSearch.description=Public endpoint used by the app to search catalogue books without authentication.
swagger.operation.books.catalog.summary=Mobile catalogue by genre
swagger.operation.books.catalog.description=Returns book blocks grouped by genre for the app home screen. Responds 204 when no items are available.
swagger.operation.books.byGenre.summary=Books by genre
swagger.operation.books.byGenre.description=Returns public books from a specific genre, paginated for app navigation.
swagger.operation.books.recommendations.summary=Student recommendations
swagger.operation.books.recommendations.description=Returns recommendations based on the student's favorite genres with rating-based fallback.
swagger.operation.books.isbnLookup.summary=External ISBN lookup
swagger.operation.books.isbnLookup.description=Searches metadata by ISBN in Google Books and BrasilAPI to prefill registration.
swagger.operation.books.get.summary=Get book
swagger.operation.books.get.description=Returns book details, including availability calculated from physical copies.
swagger.operation.books.create.summary=Create book
swagger.operation.books.create.description=Creates a catalogue book, validating unique ISBN, Dewey code, publication date and up to three genres.
swagger.operation.books.update.summary=Update book
swagger.operation.books.update.description=Updates bibliographic data for an existing book while preserving integrity rules.
swagger.operation.books.uploadCover.summary=Upload book cover
swagger.operation.books.uploadCover.description=Receives a multipart image and updates the cover stored in the storage provider.
swagger.operation.books.delete.summary=Delete book
swagger.operation.books.delete.description=Deletes a book and its copies according to rules that block deletion when active loans exist.
swagger.requestBody.books.create.description=Bibliographic data for book registration.
swagger.requestBody.books.update.description=Updated bibliographic data.
swagger.requestBody.books.uploadCover.description=Cover image file.
