swagger.tag.users.name=02. Usuários administrativos
swagger.tag.users.description=Gestão de contas ADMIN e LIBRARIAN usadas no painel administrativo.
swagger.operation.users.list.summary=Lista usuários administrativos
swagger.operation.users.list.description=Retorna usuários administrativos paginados, com busca textual opcional por e-mail ou dados principais. Uso operacional do painel.
swagger.operation.users.advancedSearch.summary=Busca avançada de usuários
swagger.operation.users.advancedSearch.description=Filtra usuários por ID, e-mail e role para auditoria e manutenção administrativa.
swagger.operation.users.create.summary=Cria usuário administrativo
swagger.operation.users.create.description=Cria conta ADMIN ou LIBRARIAN. Apenas ADMIN pode executar esta operação.
swagger.operation.users.update.summary=Atualiza usuário administrativo
swagger.operation.users.update.description=Atualiza e-mail, senha ou role de uma conta administrativa existente.
swagger.operation.users.delete.summary=Remove usuário administrativo
swagger.operation.users.delete.description=Exclui conta administrativa quando as regras de domínio permitem.
swagger.operation.users.completeTour.summary=Concluir tour guiado
swagger.operation.users.completeTour.description=Marca o tour guiado como concluído para o usuário autenticado. Idempotente.
swagger.operation.users.setStatus.summary=Ativa, desativa ou bloqueia conta
swagger.operation.users.setStatus.description=Liga ou desliga o acesso de uma conta. `active` responde por desligamento administrativo e `locked` por bloqueio de segurança; os dois campos são opcionais e o omitido não muda. Perder o acesso revoga na hora os tokens já emitidos. Um ADMIN não pode desativar a própria conta nem a última conta ADMIN ativa.
swagger.requestBody.users.create.description=Dados da nova conta administrativa.
swagger.requestBody.users.update.description=Novos dados da conta administrativa.
swagger.requestBody.users.setStatus.description=Novo estado de `active` e/ou `locked` da conta.
