swagger.tag.readers.name=03. Readers
swagger.tag.readers.description=Reader registration, lookup, updates, photo, initial password, ranking and own-profile access.
swagger.operation.readers.list.summary=List readers
swagger.operation.readers.list.description=Returns readers in an administrative page with optional text search. Restricted to ADMIN and LIBRARIAN.
swagger.operation.readers.search.summary=Advanced reader search
swagger.operation.readers.search.description=Filters readers by registration, name, course, shift, module and penalty for desk operations and reports.
swagger.operation.readers.get.summary=Get reader
swagger.operation.readers.get.description=Returns detailed reader data. ADMIN/LIBRARIAN can access any reader; READER can access only their own registration number.
swagger.operation.readers.create.summary=Register reader
swagger.operation.readers.create.description=Creates a reader record, validates course, shift and module, and creates a READER user when e-mail is present.
swagger.operation.readers.update.summary=Update reader
swagger.operation.readers.update.description=Updates registration data, address and academic links for an existing reader.
swagger.operation.readers.delete.summary=Delete reader
swagger.operation.readers.delete.description=Removes or disables the reader according to domain integrity rules.
swagger.operation.readers.resetPassword.summary=Reset reader password
swagger.operation.readers.resetPassword.description=Resets the reader password to their registration number. Used by administrators during support.
swagger.operation.readers.uploadAvatar.summary=Upload reader photo
swagger.operation.readers.uploadAvatar.description=Receives a multipart image and updates the reader's profile photo. Readers can update only their own photo.
swagger.operation.readers.ranking.summary=Reader ranking
swagger.operation.readers.ranking.description=Returns reader ranking by loan count, with optional filters by course, module and shift.
swagger.requestBody.readers.create.description=Complete reader data.
swagger.requestBody.readers.update.description=Updated reader data.
swagger.requestBody.readers.uploadAvatar.description=Profile photo image file.
