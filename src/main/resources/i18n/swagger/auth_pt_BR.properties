swagger.tag.auth.name=01. Autenticação
swagger.tag.auth.description=Login, recuperação de senha, validação de token e troca de senha do usuário autenticado.
swagger.operation.auth.login.summary=Autentica usuário
swagger.operation.auth.login.description=Recebe e-mail ou matrícula no campo `username`, valida a senha com BCrypt e retorna JWT, role e indicador de senha inicial. Endpoint público e sujeito a rate limit.
swagger.operation.auth.forgotPassword.summary=Solicita redefinição de senha
swagger.operation.auth.forgotPassword.description=Gera token temporário de redefinição e publica e-mail via fluxo de recuperação. A resposta não revela se o e-mail existe.
swagger.operation.auth.validateResetToken.summary=Valida token de redefinição
swagger.operation.auth.validateResetToken.description=Confirma se um token de redefinição ainda existe e não expirou antes de liberar a troca de senha no cliente.
swagger.operation.auth.resetPassword.summary=Redefine senha com token
swagger.operation.auth.resetPassword.description=Troca a senha usando token válido enviado por e-mail e invalida o token após o uso.
swagger.operation.auth.changePassword.summary=Troca senha autenticada
swagger.operation.auth.changePassword.description=Permite que o usuário autenticado altere a própria senha informando a senha atual e a nova senha.
swagger.requestBody.auth.login.description=Credenciais de login com e-mail administrativo ou matrícula de leitor.
swagger.requestBody.auth.forgotPassword.description=E-mail da conta que receberá o link de redefinição.
swagger.requestBody.auth.resetPassword.description=Token de redefinição e nova senha.
swagger.requestBody.auth.changePassword.description=Senha atual e nova senha do usuário autenticado.
