swagger.tag.contents.name=09. Contents
swagger.tag.contents.description=Reader-app content publishing: announcements, attachments and works/theses, with visibility controls (publication, pinning, audience and window).
swagger.operation.contents.list.summary=List contents
swagger.operation.contents.list.description=Returns every content (including unpublished/scheduled) for the admin panel, with text and type filters.
swagger.operation.contents.get.summary=Get content
swagger.operation.contents.get.description=Returns metadata and links for a specific content.
swagger.operation.contents.search.summary=Search contents
swagger.operation.contents.search.description=Filters contents by type, audience, course and year.
swagger.operation.contents.create.summary=Create content
swagger.operation.contents.create.description=Creates content using multipart, receiving JSON in the `data` field and optional cover (`coverFile`) and document (`docFile`) files.
swagger.operation.contents.update.summary=Update content
swagger.operation.contents.update.description=Updates metadata and optionally replaces the cover or document of an existing content.
swagger.operation.contents.delete.summary=Delete content
swagger.operation.contents.delete.description=Soft-deletes a content from the repository.
swagger.operation.contents.feed.summary=Reader feed
swagger.operation.contents.feed.description=Returns the contents visible to the authenticated reader: published, within the window and targeted to their audience (course/module/shift) or to everyone.
swagger.requestBody.contents.create.description=Multipart with `data` JSON and optional `coverFile` and `docFile` files.
swagger.requestBody.contents.update.description=Multipart with updated data and optional files.
