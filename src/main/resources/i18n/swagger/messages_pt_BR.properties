swagger.api.title=LumiLivre API
swagger.api.description=API RESTful para o sistema de gerenciamento biblioteccário LumiLivre.\n\nGerencia acervo, empréstimos, leitores, TCCs e integrações externas (Google Books, BrasilAPI, Supabase Storage).\n\n**Autenticação:** Bearer JWT — obtenha o token em `POST /api/auth/login`.\n\n**Roles:** ADMIN (acesso total) | LIBRARIAN (operações) | READER (próprio perfil e catálogo)

