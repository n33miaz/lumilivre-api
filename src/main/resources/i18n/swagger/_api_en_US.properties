swagger.api.description=RESTful API for LumiLivre, a school and academic library management platform.\n\nUse `POST /api/auth/login` to obtain a JWT and send `Authorization: Bearer {token}` on protected endpoints. Responses honor the `Accept-Language` header (`pt-BR` or `en-US`) and return `Content-Language`.\n\nCore modules: catalogue, book copies, readers, loans, requests, reservations, theses, reports, dashboard, XLSX imports and integrations with Google Books, BrasilAPI, ViaCEP, Supabase Storage and SMTP.
