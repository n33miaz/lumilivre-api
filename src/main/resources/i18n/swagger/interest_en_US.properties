swagger.operation.interest.toggle.summary=Mark interest in a book
swagger.operation.interest.toggle.description=Records that the authenticated reader wants to read this book. Idempotent: marking again returns 200 with the same state and the original mark timestamp, never 409. The reader comes from the token - there is no registration number parameter. READER only; guests get 401 and staff 403.
swagger.operation.interest.remove.summary=Remove interest in a book
swagger.operation.interest.remove.description=Deletes the authenticated reader's interest in this book. Idempotent: removing an interest that was not there returns 200 with interested=false. Returns a body instead of 204 so clients reuse the same parsing as the mark operation. READER only.
swagger.operation.interest.mine.summary=Reader's own interests
swagger.operation.interest.mine.description=Page of books the authenticated reader marked, newest first. Replaces the favourites list that lived in the phone's local storage. Ordering is fixed (mark date, tie-broken by id); the sort parameter is ignored.
swagger.operation.interest.summary.summary=Collection interest indicator
swagger.operation.interest.summary.description=Aggregate view for the library: per book, how many readers want it crossed with how many copies exist and how many are available. Ordered from most to least wanted, and among ties by what the library can least serve. Never identifies readers - interest is behavioural data about minors and the acquisition decision is made from the counts. Restricted to ADMIN and LIBRARIAN.
swagger.parameter.interest.summary.unmetOnly.description=When true, returns only books with no available copy - the acquisition queue.
