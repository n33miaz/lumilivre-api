swagger.api.title=LumiLivre API
swagger.api.description=RESTful API for the LumiLivre library management system.\n\nManages catalogue, loans, readers, theses and external integrations (Google Books, BrasilAPI, Supabase Storage).\n\n**Authentication:** Bearer JWT — obtain the token at `POST /api/auth/login`.\n\n**Roles:** ADMIN (full access) | LIBRARIAN (operations) | READER (own profile and catalogue)

