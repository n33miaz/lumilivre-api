swagger.api.description=API RESTful do LumiLivre para gestão de bibliotecas escolares e acadêmicas.\n\nUse `POST /api/auth/login` para obter um JWT e envie `Authorization: Bearer {token}` nos endpoints protegidos. As respostas respeitam o header `Accept-Language` (`pt-BR` ou `en-US`) e retornam `Content-Language`.\n\nMódulos principais: acervo, exemplares, leitores, empréstimos, solicitações, reservas, avisos do mural, relatórios, dashboard, importação XLSX e integrações com Google Books, BrasilAPI, ViaCEP, Supabase Storage e SMTP.
