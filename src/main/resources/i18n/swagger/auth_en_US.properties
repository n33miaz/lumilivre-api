swagger.tag.auth.name=1. Authentication
swagger.tag.auth.description=Login, password recovery, reset-token validation and authenticated password changes.
swagger.operation.auth.login.summary=Authenticate user
swagger.operation.auth.login.description=Receives e-mail or student registration in `username`, validates the password with BCrypt and returns JWT, role and initial-password flag. Public endpoint subject to rate limiting.
swagger.operation.auth.forgotPassword.summary=Request password reset
swagger.operation.auth.forgotPassword.description=Generates a temporary reset token and sends the recovery e-mail. The response does not reveal whether the e-mail exists.
swagger.operation.auth.validateResetToken.summary=Validate reset token
swagger.operation.auth.validateResetToken.description=Checks whether a reset token still exists and has not expired before the client allows a password reset.
swagger.operation.auth.resetPassword.summary=Reset password with token
swagger.operation.auth.resetPassword.description=Changes the password using a valid e-mail token and invalidates the token after use.
swagger.operation.auth.changePassword.summary=Change authenticated password
swagger.operation.auth.changePassword.description=Allows the authenticated user to change their own password by providing the current and new passwords.
swagger.requestBody.auth.login.description=Login credentials with admin e-mail or student registration number.
swagger.requestBody.auth.forgotPassword.description=Account e-mail that will receive the reset link.
swagger.requestBody.auth.resetPassword.description=Reset token and new password.
swagger.requestBody.auth.changePassword.description=Current and new password for the authenticated user.
