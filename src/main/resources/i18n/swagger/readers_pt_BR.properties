swagger.tag.readers.name=03. Leitores
swagger.tag.readers.description=Cadastro, consulta, atualização, foto, senha inicial, ranking e acesso ao próprio perfil do leitor.
swagger.operation.readers.list.summary=Lista leitores
swagger.operation.readers.list.description=Retorna leitores em página administrativa com busca textual opcional. Restrito a ADMIN e LIBRARIAN.
swagger.operation.readers.search.summary=Busca avançada de leitores
swagger.operation.readers.search.description=Filtra leitores por matrícula, nome, curso, turno, módulo e penalidade para operação de balcão e relatórios.
swagger.operation.readers.get.summary=Consulta leitor
swagger.operation.readers.get.description=Retorna dados detalhados de um leitor. ADMIN/LIBRARIAN acessam qualquer leitor; READER acessa apenas a própria matrícula.
swagger.operation.readers.create.summary=Cadastra leitor
swagger.operation.readers.create.description=Cria cadastro de leitor, valida curso, turno e módulo, e cria usuário READER quando houver e-mail.
swagger.operation.readers.update.summary=Atualiza leitor
swagger.operation.readers.update.description=Atualiza dados cadastrais, endereço e vínculo acadêmico de um leitor existente.
swagger.operation.readers.delete.summary=Remove leitor
swagger.operation.readers.delete.description=Remove ou desativa o leitor conforme regras de integridade do domínio.
swagger.operation.readers.resetPassword.summary=Reseta senha do leitor
swagger.operation.readers.resetPassword.description=Redefine a senha do leitor para a matrícula. Uso administrativo em atendimento.
swagger.operation.readers.uploadAvatar.summary=Envia foto do leitor
swagger.operation.readers.uploadAvatar.description=Recebe imagem multipart e atualiza a foto do perfil do leitor. Leitores só podem alterar a própria foto.
swagger.operation.readers.ranking.summary=Ranking de leitores
swagger.operation.readers.ranking.description=Retorna ranking de leitores por quantidade de empréstimos, com filtros opcionais por curso, módulo e turno.
swagger.requestBody.readers.create.description=Dados completos do leitor.
swagger.requestBody.readers.update.description=Dados atualizados do leitor.
swagger.requestBody.readers.uploadAvatar.description=Arquivo de imagem para foto do perfil.
