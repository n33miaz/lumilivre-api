swagger.tag.users.name=02. Admin Users
swagger.tag.users.description=Management of ADMIN and LIBRARIAN accounts used by the admin panel.
swagger.operation.users.list.summary=List admin users
swagger.operation.users.list.description=Returns paginated admin users, with optional text search by e-mail or primary fields. Used by the operations panel.
swagger.operation.users.advancedSearch.summary=Advanced user search
swagger.operation.users.advancedSearch.description=Filters users by ID, e-mail and role for auditing and administrative maintenance.
swagger.operation.users.create.summary=Create admin user
swagger.operation.users.create.description=Creates an ADMIN or LIBRARIAN account. Only ADMIN users can execute this operation.
swagger.operation.users.update.summary=Update admin user
swagger.operation.users.update.description=Updates e-mail, password or role for an existing administrative account.
swagger.operation.users.delete.summary=Delete admin user
swagger.operation.users.delete.description=Deletes an administrative account when domain rules allow it.
swagger.operation.users.completeTour.summary=Complete guided tour
swagger.operation.users.completeTour.description=Marks the guided tour as completed for the authenticated user. Idempotent.
swagger.operation.users.setStatus.summary=Activate, deactivate or lock account
swagger.operation.users.setStatus.description=Turns account access on or off. `active` covers administrative offboarding and `locked` covers a security block; both fields are optional and an omitted one is left untouched. Losing access immediately revokes tokens already issued. An ADMIN cannot deactivate their own account nor the last active ADMIN account.
swagger.requestBody.users.create.description=New administrative account data.
swagger.requestBody.users.update.description=Updated administrative account data.
swagger.requestBody.users.setStatus.description=New `active` and/or `locked` state for the account.
